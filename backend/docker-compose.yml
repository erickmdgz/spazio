# Local Postgres for the pilot backend. NOTHING here is deployed anywhere.
# Usage: docker compose up db
services:
  db:
    image: postgres:16-alpine
    container_name: spazio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spazio
      POSTGRES_PASSWORD: spazio
      POSTGRES_DB: spazio
    ports:
      - "5432:5432"
    volumes:
      - spazio_pg_data:/var/lib/postgresql/data

volumes:
  spazio_pg_data:
